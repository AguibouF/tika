# IFT3913 - Tâche 3 : action composite réutilisable qui rickrolle l'équipe
# quand au moins un cas de test échoue. Elle lit les rapports JUnit XML
# produits par Maven (Surefire et Failsafe) : un échec de compilation, de
# RAT ou de Checkstyle ne déclenche pas le rickroll.
name: 'Rickroll on test failure'
description: "Affiche un rickroll dans le résumé du run et liste les tests en échec."
inputs:
  reports:
    description: 'Motif glob des rapports JUnit XML à analyser'
    required: false
    default: '**/target/*-reports/TEST-*.xml'
  video:
    description: 'Lien vers la vidéo'
    required: false
    default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
runs:
  using: 'composite'
  steps:
    - name: Rickroll
      shell: bash
      env:
        REPORTS: ${{ inputs.reports }}
        VIDEO: ${{ inputs.video }}
      run: python3 "$GITHUB_ACTION_PATH/rickroll.py"
