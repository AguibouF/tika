# IFT3913 - Tâche 2 : exécute les tests originaux, générés (ChatUniTest) et
# manuels de XPathParser et LookaheadInputStream. Ne construit que tika-core
# et ses dépendances, pas les 124 modules de Tika.
name: tache2 tests

on:
  push:
    branches: [ main, tache2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Run task 2 tests
        run: >
          mvn install -B -pl tika-core -am
          "-Dtest=org.apache.tika.sax.xpath.*Test,org.apache.tika.io.LookaheadInputStream*Test"
          "-Dsurefire.failIfNoSpecifiedTests=false"
          "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
