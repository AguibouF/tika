rules:
  - id: ift3913-insecure-tls
    languages: [java]
    severity: ERROR
    message: "Vérification TLS désactivée : le HostnameVerifier accepte tous les noms d'hôte (CWE-295)."
    pattern-either:
      - pattern: |
          new javax.net.ssl.HostnameVerifier() {
            ...
            public boolean verify(...) {
              return true;
            }
            ...
          }
      - pattern: |
          (String $HOST, javax.net.ssl.SSLSession $SESSION) -> true
